name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.14", "3.15"]
    steps:
      # Actions are pinned to full commit SHAs; Dependabot keeps them current.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The default `enable-cache: auto` skips the cache on events prone to cache
      # poisoning (pull_request_target, workflow_run, release), so keep it unset.
      # `python-version` sets `UV_PYTHON` for later steps, overriding `.python-version`.
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install

      # `--locked` fails if uv.lock is out of date with pyproject.toml.
      - name: Sync dependencies
        run: uv sync --group dev --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check (ty)
        run: uv run ty check

      - name: Pytest
        run: uv run pytest
