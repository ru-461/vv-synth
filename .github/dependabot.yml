version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week after a release so hijacked releases are likely caught first.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    groups:
      python-dependencies:
        patterns: ["*"]
