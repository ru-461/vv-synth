name: Feature request
description: Suggest an improvement to the vv-synth CLI
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        `vv-synth` intentionally stays thin: it is an HTTP client for VOICEVOX Engine.
        Requests that would vendor the Engine, voice libraries, models, or generated audio
        are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The CLI option, behavior, or doc change you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This keeps vv-synth a thin Engine HTTP client (no bundled Engine, voices, models, or audio).
          required: true
