[project]
name = "voicevox-playground"
version = "0.1.0"
description = "VOICEVOX Engine text-to-speech playground with Typer CLI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voicevox_playground"]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "ty>=0.0.35",
]

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "voicevox_core",
]

[tool.ruff.lint]
select = ["ALL"]
preview = true
fixable = ["ALL"]
unfixable = []
ignore = [
    # formatter と競合するルール
    "COM812",
    "ISC001",
    # docstring スタイルの競合（google 採用）
    "D203",
    "D213",
    # 著作権ヘッダーは不要
    "CPY001",
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]
"voicevox_playground/engine_client.py" = [
    "S310",  # Engine へのローカル HTTP 呼び出し
    "TC003",  # Path は実行時にも使用する
    "DOC201",  # 内部ヘルパーは docstring を簡潔に保つ
    "DOC501",
]
"samples/engine_http_sample.py" = ["S310"]
"main.py" = ["TC003"]  # Typer Option で Path を実行時に使用
"voicevox_playground/output_paths.py" = ["TC003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
mypy-init-return = true
suppress-none-returning = false

[tool.ruff.lint.flake8-type-checking]
strict = true
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ty]
[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.src]
exclude = [
    "voicevox_core",
    "download",
]
